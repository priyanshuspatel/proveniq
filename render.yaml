services:
  - type: web
    name: proveniq-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # Starter plan ($7/mo) required for persistent disk support
    region: oregon # or frankfurt/ohio/singapore
    healthCheckPath: /api/health/live
    disk:
      name: proveniq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/licensetrail.db
      - key: CORS_ORIGINS
        value: https://proveniq-web.onrender.com,https://proveniq.tech,https://www.proveniq.tech
      - key: PROVENIQ_ACCESS_TOKEN
        sync: false # Required shared demo credential; generate/store it in Render, never commit it.
      - key: OLLAMA_HOST
        sync: false # Set to a private Ollama/auth-proxy endpoint reachable only from the API; raw public Ollama is refused.
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: OLLAMA_API_KEY
        sync: false # Optional credential for an actual private auth proxy; this variable is not a security boundary by itself.
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: OLLAMA_HEALTH_TIMEOUT_SECONDS
        value: "3"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "150"

  - type: web
    name: proveniq-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free # Frontend is stateless and can run on Render's free tier
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://proveniq-api.onrender.com
